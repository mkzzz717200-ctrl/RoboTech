<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ROBÔ TECH</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:linear-gradient(180deg,#050816,#0b1023,#121b35);

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

color:white;

padding:15px;

}

#app{

width:100%;
max-width:430px;

background:#10182d;

border-radius:30px;

overflow:hidden;

box-shadow:
0 0 30px rgba(0,140,255,.35);

}

header{

padding:35px;

text-align:center;

background:linear-gradient(135deg,#1b2d6d,#0b6cff);

}

header h1{

font-size:34px;

font-weight:700;

}

header p{

opacity:.85;

margin-top:8px;

}

header p{

opacity:.85;

margin-top:8px;

}

/* COLE AQUI */

.avatar{

width:85px;

height:85px;

margin:auto;

margin-bottom:15px;

border-radius:50%;

background:linear-gradient(135deg,#4facfe,#00f2fe);

display:flex;

align-items:center;

justify-content:center;

font-size:45px;

box-shadow:0 0 25px rgba(0,180,255,.6);

animation:flutuar 3s ease-in-out infinite;

}

.status{

margin-top:18px;

display:inline-flex;

align-items:center;

gap:8px;

padding:8px 16px;

background:rgba(255,255,255,.15);

border-radius:999px;

font-size:14px;

}

.bolinha{

width:10px;

height:10px;

border-radius:50%;

background:#2cff63;

box-shadow:0 0 12px #2cff63;

}

@keyframes flutuar{

0%{transform:translateY(0);}
50%{transform:translateY(-8px);}
100%{transform:translateY(0);}

}

main{

padding:22px;

}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  margin-top: 10px;
}


.card {
  
  height: 140px;
  
  background: linear-gradient(145deg, #1d4ed8, #2563eb);
  
  border-radius: 24px;
  
  display: flex;
  
  flex-direction: column;
  
  justify-content: center;
  
  align-items: center;
  
  cursor: pointer;
  
  transition:.30s ease;
  
  box-shadow: 0 10px 25px rgba(37, 99, 235, .35);
  
  position:relative;
overflow:hidden;
  
}

.azul {
  background: linear-gradient(135deg, #2563eb, #60a5fa);
  box-shadow: 0 0 25px rgba(37, 99, 235, .45);
}

.laranja {
  background: linear-gradient(135deg, #f97316, #fb923c);
  box-shadow: 0 0 25px rgba(249, 115, 22, .45);
}

.roxo {
  background: linear-gradient(135deg, #7c3aed, #a855f7);
  box-shadow: 0 0 25px rgba(124, 58, 237, .45);
}

.verde {
  background: linear-gradient(135deg, #16a34a, #4ade80);
  box-shadow: 0 0 25px rgba(22, 163, 74, .45);
}

.vermelho {
  background: linear-gradient(135deg, #dc2626, #f87171);
  box-shadow: 0 0 25px rgba(220, 38, 38, .45);
}

.ciano {
  background: linear-gradient(135deg, #0891b2, #22d3ee);
  box-shadow: 0 0 25px rgba(8, 145, 178, .45);
}

.card::before{

content:"";

position:absolute;

top:-60%;

left:-60%;

width:220%;

height:220%;

background:linear-gradient(
120deg,
transparent,
rgba(255,255,255,.25),
transparent
);

transform:rotate(25deg);

transition:.6s;

}

.card:hover::before{

left:120%;

}

.card:hover {
  
  transform: translateY(-8px) scale(1.05);
  
  box-shadow: 0 20px 40px rgba(0, 0, 0, .35);
  
}


.title {
  
  font-size: 18px;
  
  font-weight: 700;
  
  text-align: center;
  
  margin-top: 6px;
  
}

.voice{

margin-top:18px;

width:100%;

border:none;

border-radius:18px;

padding:18px;

font-size:18px;

background:#0b6cff;

color:white;

cursor:pointer;

transition:.25s;

}

.voice:hover{

background:#3386ff;

}

.screen {
  
  display: none;
  
  animation: fade .45s;
  
  padding-bottom: 20px;
  
}

.screen h2{

margin-bottom:15px;

}

.screen p {
  
  background: #1b2a4d;
  
  padding: 20px;
  
  border-radius: 20px;
  
  line-height: 1.9;
  
  font-size: 17px;
  
  color: white;
  
  white-space: pre-line;
  
  box-shadow: 0 10px 25px rgba(0, 0, 0, .25);
  
  margin-top: 20px;
  
  border-left: 5px solid #00b7ff;
  
}

.back{

margin-bottom:20px;

padding:12px 18px;

border:none;

border-radius:14px;

background:#2a3f73;

color:white;

cursor:pointer;

}

.chatHeader {
  
  display: flex;
  
  align-items: center;
  
  gap: 15px;
  
  margin-bottom: 15px;
  
}

.chatAvatar {
  
  width: 65px;
  
  height: 65px;
  
  border-radius: 50%;
  
  background: linear-gradient(135deg, #00b7ff, #0066ff);
  
  display: flex;
  
  justify-content: center;
  
  align-items: center;
  
  font-size: 32px;
  
  box-shadow: 0 0 20px rgba(0, 183, 255, .4);
  
}

.digitando {
  
  color: #8fc9ff;
  
  font-size: 14px;
  
  margin-top: 4px;
  
}

.loading{

display:none;

text-align:center;

padding:30px;

}

.loading p{

margin-top:15px;

color:#8fc9ff;

font-size:18px;

}

.dots{

display:flex;

justify-content:center;

gap:10px;

}

.dots span{

width:14px;

height:14px;

border-radius:50%;

background:#00b7ff;

animation:pulse 1s infinite;

}

.dots span:nth-child(2){

animation-delay:.2s;

}

.dots span:nth-child(3){

animation-delay:.4s;

}

@keyframes pulse{

0%,100%{

transform:scale(.5);

opacity:.3;

}

50%{

transform:scale(1.2);

opacity:1;

}

}

@keyframes fade{

from{

opacity:0;

transform:translateY(20px);

}

to{

opacity:1;

transform:none;

}

}

</style>

</head>

<body>

<div id="app">

<header>
  
  <div class="avatar">
    🤖
  </div>
  
  <h1>ROBÔ TECH</h1>
  
  <p>Seu Assistente Inteligente</p>
  
  <div class="status">
    
    <div class="bolinha"></div>
    
    Online
    
  </div>
  
</header>

<main>

<div id="menu">
  
  <div class="grid">

<div class="card azul" onclick="abrirTela('projeto')">
  <div class="icon">📘</div>
  <div class="title">Projeto</div>
</div>

<div class="card laranja" onclick="abrirTela('robo')">
  <div class="icon">🤖</div>
  <div class="title">Sobre o Robô</div>
</div>

<div class="card roxo" onclick="abrirTela('construcao')">
  <div class="icon">🛠️</div>
  <div class="title">Construção</div>
</div>

<div class="card verde" onclick="abrirTela('universo')">
  <div class="icon">🌌</div>
  <div class="title">Universo</div>
</div>

<div class="card vermelho" onclick="abrirTela('buracos')">
  <div class="icon">⚫</div>
  <div class="title">Buracos Negros</div>
</div>

<div class="card ciano" onclick="abrirTela('equipe')">
  <div class="icon">👥</div>
  <div class="title">Equipe</div>
</div>

</div>

<button class="voice">

🎤 Conversar com o Robô

</button>

</div>

<div id="conteudo" class="screen">
  
  <button class="back" onclick="voltar()">
    ⬅ Voltar
  </button>
  
  <div class="chatHeader">
  
  <div class="chatAvatar">
    🤖
  </div>
  
  <div>
    
    <h2 id="tituloTela"></h2>
    
    <p class="digitando">
      
      Assistente ROBÔ TECH
      
    </p>
    
  </div>
  
</div>
  
  <div id="loading" class="loading">
  
  <div class="dots">
    <span></span>
    <span></span>
    <span></span>
  </div>
  
  <p>Analisando...</p>
  
</div>

<p id="textoTela"></p>
  
  <button class="voice" onclick="falarTexto()">
    🔊 Ouvir explicação
  </button>
  
</div>

</main>

</div>

<script>

const telas = {
  
  projeto: {
  titulo: "📘 Apresentação do Projeto",
  texto: `O ROBÔ TECH é um projeto educacional desenvolvido com o objetivo de demonstrar, de forma prática e interativa, como a tecnologia pode ser utilizada para transmitir conhecimento.

A proposta do projeto foi unir criatividade, programação e trabalho em equipe para criar uma experiência capaz de despertar o interesse dos visitantes pela robótica e pela exploração científica.

Por meio deste sistema, os usuários podem conhecer informações sobre o robô, sua construção, o universo e diversos fenômenos espaciais que continuam fascinando cientistas em todo o mundo.`
},
  
  robo: {
  titulo: "🤖 Sobre o Robô",
  texto: `O ROBÔ TECH foi idealizado como uma plataforma interativa de apresentação.

Sua principal função é servir como meio de comunicação entre os visitantes e os conteúdos preparados pela equipe.

Embora tenha sido desenvolvido para um ambiente escolar, o projeto utiliza conceitos semelhantes aos encontrados em sistemas reais de interação digital.

O robô demonstra como a programação pode transformar dispositivos comuns em ferramentas capazes de informar, orientar e entreter pessoas de forma organizada e acessível.`
},
  
  construcao: {
  titulo: "🛠️ Como Foi Construído",
  texto: `O desenvolvimento do ROBÔ TECH exigiu planejamento, organização e cooperação entre todos os integrantes da equipe.

Inicialmente foi definida a estrutura física do projeto, seguida pela elaboração do sistema responsável pela interação com os visitantes.

A programação foi desenvolvida utilizando tecnologias web, permitindo a criação de menus, animações e recursos de voz.

Cada integrante contribuiu para diferentes etapas do trabalho, tornando possível a conclusão de um projeto que reúne conhecimentos de tecnologia, comunicação e criatividade.`
},
  
  universo: {
  titulo: "🌌 Universo",
  texto: `O universo é formado por bilhões de galáxias, cada uma contendo bilhões de estrelas e sistemas planetários.

Apesar dos avanços científicos das últimas décadas, ainda conhecemos apenas uma pequena parte do cosmos.

Telescópios modernos permitem observar regiões extremamente distantes, revelando fenômenos impressionantes e ampliando constantemente nosso conhecimento.

A exploração espacial representa um dos maiores desafios da humanidade e continua sendo fundamental para responder perguntas sobre a origem e o futuro do universo.`
},
  
  buracos: {
  titulo: "⚫ Buracos Negros",
  texto: `Os buracos negros estão entre os objetos mais misteriosos já descobertos pela ciência.

Eles são formados quando estrelas muito massivas entram em colapso e concentram uma enorme quantidade de matéria em uma região extremamente pequena.

Sua gravidade é tão intensa que nem mesmo a luz consegue escapar.

Cientistas acreditam que existe um buraco negro supermassivo no centro da Via Láctea.

O estudo desses fenômenos ajuda a compreender melhor as leis da física e o comportamento do espaço-tempo.`
},
  
  equipe: {
  titulo: "👥 Equipe de Desenvolvimento",
  texto: `👨‍💻 Roldão Bruno
Programação do sistema e da interface.

🛠 Francisco Yuri
Estrutura do ROBÔ TECH.

🛠 Mathias Caetano
Estrutura do ROBÔ TECH.

🛠 Yuri Gabriel
Estrutura do ROBÔ TECH.

🎤 Enzo Guilherme
Responsável pelas falas e conteúdos apresentados.`
}
  
};

function abrirTela(nome) {
  
  document.getElementById("menu").style.display = "none";
  
  document.getElementById("conteudo").style.display = "block";
  
  document.getElementById("tituloTela").innerHTML = telas[nome].titulo;
  
  const loading = document.getElementById("loading");
  
  const texto = document.getElementById("textoTela");
  
  loading.style.display = "block";
  
  texto.style.display = "none";
  
  setTimeout(() => {
    
    loading.style.display = "none";
    
    texto.style.display = "block";
    
    texto.textContent = telas[nome].texto;
    
  }, 900);
  
}

function digitarTexto(texto) {
  
  const area = document.getElementById("textoTela");
  
  area.textContent = "";
  
  const palavras = texto.split(" ");
  
  let i = 0;
  
  const efeito = setInterval(() => {
    
    if (i >= palavras.length) {
      
      clearInterval(efeito);
      
      return;
      
    }
    
    area.textContent += palavras[i] + " ";
    
    i++;
    
  }, 45);
  
}

function voltar() {
  
  document.getElementById("conteudo").style.display = "none";
  
  document.getElementById("menu").style.display = "block";
  
}

function falarTexto() {
  
  const texto = document.getElementById("textoTela").innerText;
  
  const voz = new SpeechSynthesisUtterance(texto);
  
  voz.lang = "pt-BR";
  
  voz.rate = 0.95;
  
  speechSynthesis.cancel();
  
  speechSynthesis.speak(voz);
  
}

</script>

</body>
</html>
